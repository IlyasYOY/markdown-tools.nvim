name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Lua and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.4.0
          args: false

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

  test:
    name: Test Neovim ${{ matrix.neovim }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.11.7, v0.12.4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true

      - name: Test
        run: make test help-check
